<!DOCTYPE html>
<html lang="nb" data-theme="dark" data-motion="off" data-palette="signal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siden finnes ikke – xdkurbie</title>
<meta name="description" content="Siden finnes ikke på xdkurbie.github.io.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07090a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem("theme");
    var theme = saved === "light" || saved === "dark"
      ? saved
      : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#f4f5ef" : "#07090a");
    var motionSaved = localStorage.getItem("motion");
    var motion = motionSaved === "on" || motionSaved === "off"
      ? motionSaved
      : (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on");
    document.documentElement.setAttribute("data-motion", motion);
    var palette = localStorage.getItem("palette");
    if (palette === "aurora" || palette === "kobber" || palette === "signal") {
      document.documentElement.setAttribute("data-palette", palette);
    }
    var darkBg = { signal: "#07090a", aurora: "#090712", kobber: "#110c09" };
    var lightBg = { signal: "#f4f5ef", aurora: "#f7f3fb", kobber: "#fbf6f1" };
    var chosen = document.documentElement.getAttribute("data-palette") || "signal";
    if (meta) meta.setAttribute("content", theme === "light" ? lightBg[chosen] : darkBg[chosen]);
  } catch (e) {}
})();
</script>
</head>
<body>
<a class="skip" href="#innhold">Hopp til innhold</a>
<header class="nav">
  <a class="logo" href="/">xdkurbie<span>.</span></a>
  <nav class="nav-links" aria-label="Hovedmeny">
    <a href="/#prosjekter">Prosjekter</a>
    <a href="/#om-meg">Om meg</a>
    <a href="/#kontakt">Kontakt</a>
  </nav>
  <div class="nav-controls">
    <div class="palettes" role="group" aria-label="Fargepalett">
      <button type="button" class="hud-btn" data-palette-set="signal" aria-pressed="true">Signal</button>
      <button type="button" class="hud-btn" data-palette-set="aurora" aria-pressed="false">Aurora</button>
      <button type="button" class="hud-btn" data-palette-set="kobber" aria-pressed="false">Kobber</button>
    </div>
    <button type="button" class="hud-btn" id="motion-toggle" aria-pressed="false">
      <span class="when-motion-on">Bevegelse på</span>
      <span class="when-motion-off">Bevegelse av</span>
    </button>
    <button type="button" class="hud-btn" id="theme-toggle">
      <span class="when-dark">Lyst tema</span>
      <span class="when-light">Mørkt tema</span>
    </button>
  </div>
</header>
<main id="innhold" class="miss">
  <div class="wrap">
    <p class="kicker">ICMP · dest unreachable</p>
    <h1>Siden finnes ikke</h1>
    <p class="lede">Lenken er feil, eller siden er flyttet. Ruten stopper her.</p>
    <div class="actions">
      <a class="btn primary" href="/">Til forsiden <span class="arrow" aria-hidden="true">→</span></a>
      <a class="btn" href="/#prosjekter">Se prosjekter <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </div>
</main>
<script src="/script.js" defer></script>
</body>
</html>
